name: Invoice preview checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 scripts/build_offline.py && git diff --exit-code index.html
      - run: node --check dist/app.js && node --check dist/invoice-renderer.js
      - run: python3 scripts/test_static_preview.py
      - run: node scripts/test_preview_fit.cjs
      - run: node scripts/test_invoice_math.cjs
      - run: node scripts/test_invoice_rows.cjs
      - run: node scripts/test_sync.cjs
      - run: node scripts/test_preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-preview-results
          path: test-results/
